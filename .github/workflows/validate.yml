name: Validate PR

# PR validation only — this workflow NEVER deploys (Gate D).
# Runs on pull requests and manual dispatch; read-only permissions.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing to write.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck, lint, static export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export (GitHub Pages mode)
        run: npm run build:github-pages
        env:
          DEPLOY_TARGET: github-pages

      - name: Assert export output exists
        run: |
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          echo "Static export verified: out/ contains index.html, robots.txt, sitemap.xml"

      - name: Upload export artifact for review (not deployment)
        uses: actions/upload-artifact@v4
        with:
          name: static-export-pr-${{ github.event.pull_request.number || github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: error
